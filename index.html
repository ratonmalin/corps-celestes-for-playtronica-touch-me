<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Corps Célestes · instrument musical expérimental pour Playtronica TouchMe.">
    <title>Corps Célestes</title>
    <link rel="stylesheet" href="./css/style.css?v=20261002-46">
</head>
<body autocomplete="off">
    <main class="app">
        <div id="idle-message" class="idle-message" aria-hidden="true">
            <span id="idle-message-text"></span>
        </div>
        <img id="idle-hands" class="idle-hands" src="./assets/idle-hands.svg" alt="" aria-hidden="true">

        <header class="header">
            <div class="header-info">
                <h1>Corps Célestes</h1>
                <p></p>
            </div>

            <div class="header-actions">
                <button id="fullscreen" class="text-button" type="button">FULL SCREEN</button>
            </div>
        </header>

        <div class="status-bar" aria-live="polite">
            <span id="led" class="led"></span>
            <span id="status">CAPTEUR CONNECTÉ</span>
            <button id="midi-permission" class="text-button midi-permission" type="button" hidden>ACTIVER MIDI</button>
        </div>

        <div class="effect-panel">
            <button id="scale" class="text-button scale-control" type="button" aria-label="Changer de gamme">GAMME · PENTATONIQUE MAJEURE</button>
            <button id="instrument" class="text-button instrument-control" type="button" aria-label="Changer d'instrument">INSTRUMENT · SYNTHÉTIQUE</button>
            <div class="effect-controls" aria-label="Effets audio">
            <label class="effect-slider">
                <span>REVERB</span>
                <output class="effect-value">58%</output>
                <input type="range" min="0" max="1" step=".01" value=".58" data-effect="reverb" aria-label="Reverb">
            </label>
            <label class="effect-slider">
                <span>DELAY</span>
                <output class="effect-value">0%</output>
                <input type="range" min="0" max="1" step=".01" value="0" data-effect="delay" aria-label="Delay">
            </label>
            <label class="effect-slider">
                <span>ECHO</span>
                <output class="effect-value">0%</output>
                <input type="range" min="0" max="1" step=".01" value="0" data-effect="echo" aria-label="Echo">
            </label>
            </div>
        </div>

        <div class="technical">
            <span>NOTE <b id="freq">—</b></span>
            <label>
                SENSIBILITÉ
                <output id="sens-out">1.0×</output>
                <input id="sensitivity" type="range" min=".25" max="3" value="1" step=".05">
            </label>
            <label>
                VOLUME
                <output id="volume-out">50%</output>
                <input id="volume" type="range" min="0" max="1" value=".5" step=".01" autocomplete="off">
            </label>
        </div>
    </main>

    <script type="module" src="./js/main.js?v=20261002-50"></script>
</body>
</html>
