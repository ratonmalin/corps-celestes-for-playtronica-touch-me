<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Corps Célestes · instrument musical expérimental pour Playtronica TouchMe.">
    <title>Corps Célestes</title>
    <link rel="stylesheet" href="./css/style.css?v=4">
</head>
<body>
    <main class="app">
        <div id="idle-message" class="idle-message" aria-hidden="true"></div>

        <header class="header">
            <div class="header-info">
                <h1>Corps Célestes</h1>
                <p>Playtronica TouchMe · Camille Grigaut</p>
            </div>

            <div class="header-actions">
                <button id="connect" class="text-button" type="button">TOUCHME</button>
                <button id="audio" class="text-button" type="button">AUDIO</button>
                <select id="scale" class="scale-control" aria-label="Changer de gamme">
                    <option value="0">GAMME · MAJEURE</option>
                    <option value="1">GAMME · DORIENNE</option>
                    <option value="2">GAMME · CHROMATIQUE</option>
                </select>
                <button id="fullscreen" class="text-button" type="button">FULL SCREEN</button>
            </div>
        </header>

        <div class="status-bar">
            <span id="led" class="led"></span>
            <span id="status">EN ATTENTE</span>
            <span class="separator">/</span>
            <span id="device">AUCUN APPAREIL</span>
        </div>

        <div class="technical">
            <span>TOUCHER <b id="cc-value">—</b></span>
            <span>NOTE <b id="freq">—</b></span>
            <label>
                SENSIBILITÉ
                <output id="sens-out">1.0×</output>
                <input id="sensitivity" type="range" min=".25" max="3" value="1" step=".05">
            </label>
        </div>

        <div id="planet" class="proxy" aria-hidden="true"></div>
        <span id="level" class="proxy" aria-hidden="true">0%</span>
        <span id="cc-meter" class="proxy" aria-hidden="true"></span>
        <span id="freq-meter" class="proxy" aria-hidden="true"></span>
    </main>

    <script type="module" src="./js/main.js?v=4"></script>
</body>
</html>
