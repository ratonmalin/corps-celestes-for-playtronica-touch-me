<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Corps Célestes — instrument audiovisuel pour Playtronica TouchMe.">
    <title>Corps Célestes · TouchMe</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="header-info">
                <h1>Corps Célestes</h1>
                <p>Playtronica TouchMe · instrument audiovisuel</p>
            </div>

            <div class="header-actions">
                <button id="connect" class="text-button" type="button">CONNECTER</button>
                <button id="audio" class="text-button" type="button">AUDIO</button>
                <select id="scale" class="scale-control" aria-label="Choisir une gamme">
                    <option value="0">GAMME · PENTATONIQUE</option>
                    <option value="1">GAMME · DORIENNE</option>
                    <option value="2">GAMME · CHROMATIQUE</option>
                </select>
            </div>
        </header>

        <section class="readout" aria-label="État du système">
            <div class="status-line">
                <span id="led" class="led"></span>
                <span id="status">EN ATTENTE DU TOUCHME</span>
                <span class="separator">/</span>
                <span id="device">AUCUN APPAREIL</span>
            </div>

            <div class="meters">
                <div class="meter">
                    <span>TOUCHER</span>
                    <div class="track"><i id="cc-meter"></i></div>
                    <b id="cc-value">—</b>
                </div>

                <div class="meter">
                    <span>NOTE</span>
                    <div class="track"><i id="freq-meter"></i></div>
                    <b id="freq">—</b>
                </div>
            </div>

            <div class="controls">
                <label for="sensitivity">SENSIBILITÉ <output id="sens-out">1.0×</output></label>
                <input id="sensitivity" type="range" min=".25" max="3" value="1" step=".05">
            </div>
        </section>

        <div id="planet" class="state-proxy" aria-hidden="true"></div>
        <span id="level" class="level-proxy" aria-hidden="true">0%</span>
    </main>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
