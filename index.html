<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Corps Célestes · instrument musical expérimental pour Playtronica TouchMe.">
    <title>Corps Célestes</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body autocomplete="off">
    <main class="app">
        <div id="idle-message" class="idle-message" aria-hidden="true"></div>

        <header class="header">
            <div class="header-info">
                <h1>Corps Célestes</h1>
                <p>Playtronica TouchMe · Camille Grigaut</p>
            </div>

            <div class="header-actions">
                <select id="scale" class="scale-control" aria-label="Changer de gamme">
                    <option value="0">GAMME · PENTATONIQUE MAJEURE</option>
                    <option value="1">GAMME · PENTATONIQUE MINEURE</option>
                    <option value="2">GAMME · SUSPENDUE</option>
                </select>
                <button id="fullscreen" class="text-button" type="button">FULL SCREEN</button>
            </div>
        </header>

        <div class="status-bar">
            <span id="led" class="led"></span>
            <span id="status">EN ATTENTE</span>
            <span class="separator">/</span>
            <span id="device">AUCUN APPAREIL</span>
        </div>

        <div class="technical">
            <span>TOUCHER <b id="cc-value">—</b></span>
            <span>NOTE <b id="freq">—</b></span>
            <label>
                SENSIBILITÉ
                <output id="sens-out">1.0×</output>
                <input id="sensitivity" type="range" min=".25" max="3" value="1" step=".05">
            </label>
            <label>
                VOLUME
                <output id="volume-out">50%</output>
                <input id="volume" type="range" min="0" max="1" value=".5" step=".01" autocomplete="off">
            </label>
        </div>
    </main>

    <script type="module" src="./js/main.js?v=20261002-07"></script>
</body>
</html>
